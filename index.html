<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Szerviz - Időpontfoglalás</title>
    
    <!-- Google Fonts: Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;800&display=swap" rel="stylesheet">
    
    <!-- FontAwesome Ikonok -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Flatpickr (Naptár) CSS - Sötét téma -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" type="text/css" href="https://npmcdn.com/flatpickr/dist/themes/dark.css">

    <!-- SweetAlert2 (Popup) CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">

    <style>
        body { 
            font-family: 'Poppins', sans-serif; 
            background-color: #0f172a;
            background-image: 
                linear-gradient(rgba(15, 23, 42, 0.85), rgba(15, 23, 42, 0.95)),
                url('https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #f8fafc; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0;
            padding: 20px; 
            box-sizing: border-box;
        }
        
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .container { 
            background: rgba(30, 41, 59, 0.7); 
            backdrop-filter: blur(12px); 
            -webkit-backdrop-filter: blur(12px);
            padding: 40px; 
            border-radius: 16px; 
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 30px rgba(56, 189, 248, 0.15); 
            max-width: 550px; 
            width: 100%; 
            border-top: 5px solid #38bdf8; 
            border-bottom: 1px solid rgba(255,255,255,0.05);
            border-left: 1px solid rgba(255,255,255,0.05);
            border-right: 1px solid rgba(255,255,255,0.05);
            animation: fadeInUp 0.7s ease-out forwards; 
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-5px); }
            40%, 80% { transform: translateX(5px); }
        }
        .error-shake { animation: shake 0.4s ease-in-out; }

        h1 { 
            text-align: center; 
            color: #38bdf8; 
            margin-top: 0;
            margin-bottom: 35px;
            font-weight: 800;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 10px rgba(56, 189, 248, 0.3);
        }
        
        .form-group { margin-bottom: 25px; }
        
        /* Címkék (Label) javítva, hogy rendesen fent legyenek */
        label { 
            display: block; 
            margin-bottom: 8px; 
            font-weight: 600; 
            color: #94a3b8; 
            font-size: 13px; 
            text-transform: uppercase; 
            letter-spacing: 0.8px; 
        }
        
        /* Ikonok és beviteli mezők konténere */
        .input-wrapper { position: relative; width: 100%; }
        
        /* Ikonok fix pozíciója a dobozon belül */
        .input-wrapper i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #38bdf8;
            font-size: 16px;
            pointer-events: none; 
            transition: color 0.3s ease;
            z-index: 2;
        }

        /* A textarea ikonja kicsit feljebb kell, hogy ne az alján legyen */
        .input-wrapper.textarea-wrapper i {
            top: 20px;
            transform: none;
        }
        
        select, input[type="text"], textarea { 
            font-family: 'Poppins', sans-serif;
            width: 100%; 
            padding: 14px 14px 14px 45px; 
            border: 1px solid #334155; 
            border-radius: 8px; 
            background: rgba(15, 23, 42, 0.8); 
            color: #fff; 
            outline: none; 
            box-sizing: border-box;
            transition: all 0.3s ease;
            font-size: 15px;
        }

        select {
            appearance: none;
            cursor: pointer;
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%2394a3b8%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat;
            background-position: right 15px top 50%;
            background-size: 12px auto;
        }

        textarea {
            resize: vertical;
            min-height: 90px;
        }

        select:focus, input:focus, textarea:focus { 
            border-color: #38bdf8; 
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
            background: rgba(21, 34, 56, 0.9);
        }
        
        @keyframes slideDownFade {
            from { opacity: 0; transform: translateY(-15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .slide-down-anim { animation: slideDownFade 0.4s ease-out forwards; }

        .slots { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 15px; }
        .slot { 
            background: rgba(51, 65, 85, 0.8); 
            border: 1px solid #475569; 
            padding: 12px 5px; 
            text-align: center; 
            border-radius: 8px; 
            cursor: pointer; 
            transition: all 0.3s ease; 
            color: #e2e8f0; 
            font-size: 14px;
            font-weight: 500;
        }
        .slot:hover { background: rgba(71, 85, 105, 0.9); }
        .slot.selected { 
            background: #38bdf8; 
            color: #0f172a; 
            font-weight: 800; 
            border-color: #38bdf8; 
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(56, 189, 248, 0.4);
        }
        
        .or-divider { text-align: center; margin: 30px 0; color: #94a3b8; font-weight: 600; position: relative; font-size: 12px; text-transform: uppercase; letter-spacing: 1.5px;}
        .or-divider::before, .or-divider::after { content: ""; position: absolute; top: 50%; width: 35%; height: 1px; background: #475569; }
        .or-divider::before { left: 0; }
        .or-divider::after { right: 0; }
        
        button.submit-btn { 
            font-family: 'Poppins', sans-serif;
            width: 100%; 
            padding: 16px; 
            background: linear-gradient(135deg, #38bdf8 0%, #0ea5e9 100%);
            color: #0f172a; 
            border: none; 
            border-radius: 8px; 
            font-size: 16px; 
            font-weight: 800; 
            cursor: pointer; 
            transition: all 0.2s ease; 
            margin-top: 15px; 
            box-shadow: 0 10px 20px rgba(14, 165, 233, 0.3);
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }
        button.submit-btn:hover { 
            transform: translateY(-2px);
            box-shadow: 0 15px 25px rgba(14, 165, 233, 0.4);
        }
        button.submit-btn:active {
            transform: scale(0.97); 
            box-shadow: 0 5px 10px rgba(14, 165, 233, 0.3);
        }
        button.submit-btn:disabled { background: #64748b; cursor: not-allowed; transform: none; box-shadow: none; color: #94a3b8;}
        
        @media (max-width: 600px) {
            .container { padding: 30px 20px; }
            .slots { grid-template-columns: repeat(2, 1fr); } 
            .slot { padding: 15px 5px; font-size: 15px; } 
        }
    </style>
    
    <!-- SCRIPT BEIMPORTÁLÁSOK -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://npmcdn.com/flatpickr/dist/l10n/hu.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <script type="text/javascript">
        (function(){
            emailjs.init({
                publicKey: "wfKJ5kifXQEyGFDYy",
            });
        })();
    </script>
</head>
<body>
    <div class="container" id="main-container">
        <h1>IT Időpontfoglaló</h1>
        
        <div class="form-group">
            <label for="date-select">Válassz munkanapot:</label>
            <div class="input-wrapper">
                <i class="fa-solid fa-calendar-days"></i>
                <input type="text" id="date-select" placeholder="Kattints a dátum kiválasztásához..." readonly required>
            </div>
        </div>
        
        <div id="dynamic-time-section" style="display: none;">
            <div class="form-group">
                <label>Válassz kezdési időpontot (06:00 - 18:00):</label>
                <div class="slots" id="slots"></div>
                
                <label style="margin-top: 25px;" for="duration">Kért Időtartam:</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-hourglass-half"></i>
                    <select id="duration">
                        <option value="30 perc">30 perc (Minimum)</option>
                        <option value="1 óra">1 óra</option>
                        <option value="1.5 óra">1.5 óra</option>
                        <option value="2 óra">2 óra</option>
                        <option value="3 óra">3 óra</option>
                        <option value="4 óra">4 óra</option>
                        <option value="Egész nap">Egész nap</option>
                    </select>
                </div>
            </div>

            <div class="or-divider">VAGY</div>

            <div class="form-group">
                <label for="custom-time">Egyedi időintervallum megadása:</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-pen-to-square"></i>
                    <input type="text" id="custom-time" placeholder="Pl.: 08:15 - 10:45 vagy 'Csak délután'">
                </div>
            </div>
        </div>

        <div class="form-group">
            <label for="name">Ügyfél neve:</label>
            <div class="input-wrapper">
                <i class="fa-solid fa-user"></i>
                <input type="text" id="name" placeholder="Pl.: Kovács János" required>
            </div>
        </div>

        <div class="form-group">
            <label for="problem">A probléma rövid leírása:</label>
            <div class="input-wrapper textarea-wrapper">
                <i class="fa-solid fa-wrench"></i>
                <textarea id="problem" placeholder="Írd le röviden, mi a hiba vagy milyen szolgáltatásra van szükséged..." required></textarea>
            </div>
        </div>
        
        <button class="submit-btn" id="book-btn">
            <i class="fa-solid fa-paper-plane" id="btn-icon"></i> 
            <span id="btn-text">Időpont Lefoglalása</span>
        </button>
    </div>

    <script>
        const holidays = [
            '2026-01-01', '2026-03-15', '2026-04-03', '2026-04-06',
            '2026-05-01', '2026-05-25', '2026-08-20', '2026-10-23',
            '2026-11-01', '2026-12-24', '2026-12-25', '2026-12-26'
        ];
        const workingSaturdays = ['2026-08-08', '2026-12-12'];

        const dateSelect = document.getElementById('date-select');
        const slotsContainer = document.getElementById('slots');
        const timeSection = document.getElementById('dynamic-time-section');
        const customTimeInput = document.getElementById('custom-time');
        const container = document.getElementById('main-container');
        let selectedTime = null;

        flatpickr("#date-select", {
            locale: "hu",
            minDate: "today",
            dateFormat: "Y-m-d",
            disable: [
                function(date) {
                    const dateString = date.toLocaleDateString('en-CA');
                    const day = date.getDay();
                    if (holidays.includes(dateString)) return true;
                    if (workingSaturdays.includes(dateString)) return false;
                    return (day === 0 || day === 6);
                }
            ],
            onChange: function(selectedDates, dateStr, instance) {
                if (dateStr) {
                    timeSection.style.display = 'block';
                    timeSection.classList.remove('slide-down-anim');
                    void timeSection.offsetWidth;
                    timeSection.classList.add('slide-down-anim');
                    
                    generateSlots();
                    selectedTime = null;
                    customTimeInput.value = '';
                }
            }
        });

        function generateSlots() {
            slotsContainer.innerHTML = '';
            for (let hour = 6; hour < 18; hour++) {
                ['00', '30'].forEach(minute => {
                    const timeString = `${hour.toString().padStart(2, '0')}:${minute}`;
                    const slot = document.createElement('div');
                    slot.className = 'slot';
                    slot.textContent = timeString;
                    slot.onclick = () => selectTime(slot, timeString);
                    slotsContainer.appendChild(slot);
                });
            }
        }

        function selectTime(element, time) {
            document.querySelectorAll('.slot').forEach(s => s.classList.remove('selected'));
            element.classList.add('selected');
            selectedTime = time;
            customTimeInput.value = '';
        }

        customTimeInput.addEventListener('input', () => {
            if(customTimeInput.value.trim() !== '') {
                document.querySelectorAll('.slot').forEach(s => s.classList.remove('selected'));
                selectedTime = null;
            }
        });

        document.getElementById('book-btn').addEventListener('click', () => {
            const name = document.getElementById('name').value;
            const date = dateSelect.value;
            const duration = document.getElementById('duration').value;
            const customTime = customTimeInput.value.trim();
            const problem = document.getElementById('problem').value.trim();
            const btn = document.getElementById('book-btn');
            const btnIcon = document.getElementById('btn-icon');
            const btnText = document.getElementById('btn-text');

            let finalTimeStr = "";
            if (customTime !== "") {
                finalTimeStr = customTime + " (Kézzel megadva)";
            } else if (selectedTime) {
                finalTimeStr = selectedTime + " (Időtartam: " + duration + ")";
            }

            if (!date || !name || finalTimeStr === "" || !problem) {
                container.classList.remove('error-shake');
                void container.offsetWidth;
                container.classList.add('error-shake');
                
                Swal.fire({
                    title: 'Hiányzó adatok!',
                    text: 'Kérlek tölts ki minden mezőt (beleértve a probléma leírását is)!',
                    icon: 'warning',
                    background: '#1e293b',
                    color: '#f8fafc',
                    confirmButtonColor: '#38bdf8'
                });
                return;
            }

            btn.disabled = true;
            btnIcon.className = "fa-solid fa-spinner fa-spin";
            btnText.textContent = "KÜLDÉS FOLYAMATBAN...";

            const templateParams = {
                name: name,
                date: date,
                time: finalTimeStr,
                problem: problem
            };

            emailjs.send('service_buq6g7d', 'template_cuctmh5', templateParams)
                .then(function(response) {
                    Swal.fire({
                        title: 'Sikeres Foglalás!',
                        text: `Várom szeretettel: ${name}`,
                        icon: 'success',
                        background: '#1e293b',
                        color: '#f8fafc',
                        confirmButtonColor: '#22c55e'
                    });
                    
                    document.getElementById('name').value = '';
                    dateSelect.value = '';
                    document.getElementById('problem').value = '';
                    timeSection.style.display = 'none';
                    selectedTime = null;
                    customTimeInput.value = '';
                    
                    btn.disabled = false;
                    btnIcon.className = "fa-solid fa-paper-plane";
                    btnText.textContent = "IDŐPONT LEFOGLALÁSA";
                    
                }, function(error) {
                    Swal.fire({
                        title: 'Hiba történt!',
                        text: 'Sajnos nem sikerült elküldeni a foglalást. Kérlek próbáld újra!',
                        icon: 'error',
                        background: '#1e293b',
                        color: '#f8fafc',
                        confirmButtonColor: '#ef4444'
                    });
                    
                    btn.disabled = false;
                    btnIcon.className = "fa-solid fa-paper-plane";
                    btnText.textContent = "IDŐPONT LEFOGLALÁSA";
                });
        });
    </script>
</body>
</html>
