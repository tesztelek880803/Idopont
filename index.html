<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Szerviz - Időpontfoglalás</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; padding: 40px 20px; margin: 0; }
        .container { background: #1e293b; padding: 30px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0, 210, 255, 0.1); max-width: 550px; width: 100%; border-top: 4px solid #38bdf8; }
        h1 { text-align: center; color: #38bdf8; margin-bottom: 30px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #94a3b8; }
        select, input[type="text"] { width: 100%; padding: 12px; border: 1px solid #334155; border-radius: 6px; background: #0f172a; color: #fff; outline: none; box-sizing: border-box; }
        select:focus, input:focus { border-color: #38bdf8; }
        .slots { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 15px; }
        .slot { background: #334155; border: 1px solid #475569; padding: 10px; text-align: center; border-radius: 6px; cursor: pointer; transition: all 0.3s ease; color: #e2e8f0; font-size: 14px; }
        .slot:hover, .slot.selected { background: #38bdf8; color: #0f172a; font-weight: bold; border-color: #38bdf8; transform: translateY(-2px); }
        button.submit-btn { width: 100%; padding: 14px; background: #38bdf8; color: #0f172a; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 20px; }
        button.submit-btn:hover { background: #0ea5e9; }
        button.submit-btn:disabled { background: #64748b; cursor: not-allowed; }
        #message { margin-top: 20px; text-align: center; font-weight: bold; padding: 10px; border-radius: 6px; }
        .or-divider { text-align: center; margin: 25px 0; color: #64748b; font-weight: bold; position: relative; font-size: 14px; }
        .or-divider::before, .or-divider::after { content: ""; position: absolute; top: 50%; width: 40%; height: 1px; background: #334155; }
        .or-divider::before { left: 0; }
        .or-divider::after { right: 0; }
    </style>
    
    <!-- EMAILJS BEIMPORTÁLÁSA -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script type="text/javascript">
        (function(){
            emailjs.init({
                publicKey: "wfKJ5kifXQEyGFDYy",
            });
        })();
    </script>
</head>
<body>
    <div class="container">
        <h1>Rendszergazdai Időpontfoglaló</h1>
        
        <div class="form-group">
            <label for="date-select">Válassz munkanapot:</label>
            <select id="date-select" required>
                <option value="">-- Válassz egy szabad munkanapot --</option>
            </select>
        </div>
        
        <div id="dynamic-time-section" style="display: none;">
            <div class="form-group">
                <label>Válassz kezdési időpontot (06:00 - 18:00):</label>
                <div class="slots" id="slots"></div>
                
                <label style="margin-top: 15px;" for="duration">Időtartam (minimum 30 perc):</label>
                <select id="duration">
                    <option value="30 perc">30 perc</option>
                    <option value="1 óra">1 óra</option>
                    <option value="1.5 óra">1.5 óra</option>
                    <option value="2 óra">2 óra</option>
                    <option value="3 óra">3 óra</option>
                    <option value="4 óra">4 óra</option>
                    <option value="Egész nap">Egész nap</option>
                </select>
            </div>

            <div class="or-divider">VAGY</div>

            <div class="form-group">
                <label for="custom-time">Egyedi időintervallum kézi megadása:</label>
                <input type="text" id="custom-time" placeholder="Pl.: 08:15 - 10:45 vagy 'Csak délután'">
            </div>
        </div>

        <div class="form-group">
            <label for="name">Ügyfél neve:</label>
            <input type="text" id="name" placeholder="Pl.: Kovács János" required>
        </div>
        
        <button class="submit-btn" id="book-btn">Időpont Lefoglalása</button>
        <div id="message"></div>
    </div>

    <script>
        const holidays = [
            '2026-01-01', '2026-03-15', '2026-04-03', '2026-04-06',
            '2026-05-01', '2026-05-25', '2026-08-20', '2026-10-23',
            '2026-11-01', '2026-12-24', '2026-12-25', '2026-12-26'
        ];
        const workingSaturdays = ['2026-08-08', '2026-12-12'];

        const dateSelect = document.getElementById('date-select');
        const slotsContainer = document.getElementById('slots');
        const timeSection = document.getElementById('dynamic-time-section');
        const customTimeInput = document.getElementById('custom-time');
        let selectedTime = null;

        function isWorkDay(dateString) {
            const date = new Date(dateString);
            const day = date.getDay();
            if (holidays.includes(dateString)) return false;
            if (workingSaturdays.includes(dateString)) return true;
            if (day === 0 || day === 6) return false; 
            return true;
        }

        function populateWorkDays() {
            const today = new Date();
            const options = { weekday: 'long', year: 'numeric', month: '2-digit', day: '2-digit' };
            for (let i = 0; i < 30; i++) {
                const d = new Date(today);
                d.setDate(today.getDate() + i);
                const dateString = d.toLocaleDateString('en-CA');
                if (isWorkDay(dateString)) {
                    const formattedDate = d.toLocaleDateString('hu-HU', options);
                    const option = document.createElement('option');
                    option.value = dateString;
                    option.textContent = `${dateString} (${formattedDate})`;
                    dateSelect.appendChild(option);
                }
            }
        }

        function generateSlots() {
            slotsContainer.innerHTML = '';
            for (let hour = 6; hour < 18; hour++) {
                ['00', '30'].forEach(minute => {
                    const timeString = `${hour.toString().padStart(2, '0')}:${minute}`;
                    const slot = document.createElement('div');
                    slot.className = 'slot';
                    slot.textContent = timeString;
                    slot.onclick = () => selectTime(slot, timeString);
                    slotsContainer.appendChild(slot);
                });
            }
        }

        function selectTime(element, time) {
            document.querySelectorAll('.slot').forEach(s => s.classList.remove('selected'));
            element.classList.add('selected');
            selectedTime = time;
            // Ha gombra kattint, töröljük a kézi szövegdobozt
            customTimeInput.value = '';
        }

        // Ha elkezd gépelni a kézi dobozba, töröljük a gombos választást
        customTimeInput.addEventListener('input', () => {
            if(customTimeInput.value.trim() !== '') {
                document.querySelectorAll('.slot').forEach(s => s.classList.remove('selected'));
                selectedTime = null;
            }
        });

        dateSelect.addEventListener('change', (e) => {
            if (e.target.value) {
                timeSection.style.display = 'block';
                generateSlots();
                selectedTime = null;
                customTimeInput.value = '';
            } else {
                timeSection.style.display = 'none';
                selectedTime = null;
                customTimeInput.value = '';
            }
        });

        document.getElementById('book-btn').addEventListener('click', () => {
            const name = document.getElementById('name').value;
            const date = dateSelect.value;
            const duration = document.getElementById('duration').value;
            const customTime = customTimeInput.value.trim();
            const msg = document.getElementById('message');
            const btn = document.getElementById('book-btn');

            let finalTimeStr = "";
            if (customTime !== "") {
                finalTimeStr = customTime + " (Kézzel megadva)";
            } else if (selectedTime) {
                finalTimeStr = selectedTime + " (Időtartam: " + duration + ")";
            }

            if (!date || !name || finalTimeStr === "") {
                msg.textContent = "Kérlek válassz dátumot, időpontot (vagy adj meg egyedit) és add meg a neved!";
                msg.style.color = "#ef4444";
                return;
            }

            btn.disabled = true;
            btn.textContent = "Küldés folyamatban...";
            msg.textContent = "";

            const templateParams = {
                name: name,
                date: date,
                time: finalTimeStr
            };

            emailjs.send('service_buq6g7d', 'template_cuctmh5', templateParams)
                .then(function(response) {
                    msg.textContent = `Sikeres foglalás rögzítve: ${name} részére.`;
                    msg.style.color = "#0f172a";
                    msg.style.backgroundColor = "#22c55e";
                    
                    document.getElementById('name').value = '';
                    dateSelect.value = '';
                    timeSection.style.display = 'none';
                    selectedTime = null;
                    customTimeInput.value = '';
                    btn.disabled = false;
                    btn.textContent = "Időpont Lefoglalása";
                }, function(error) {
                    msg.textContent = "Hiba történt a küldés során. Próbáld újra!";
                    msg.style.color = "#ef4444";
                    btn.disabled = false;
                    btn.textContent = "Időpont Lefoglalása";
                });
        });

        populateWorkDays();
    </script>
</body>
</html>
